<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>We're Sorry to See You Go — LootPrice Feedback</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #0B0D10;
    --bg-1: #101216;
    --bg-2: #171A1F;
    --border: #30343B;
    --text-0: #F5F5F5;
    --text-2: #969BA5;
    --accent: #FFB000;
    --accent-hover: #FFC229;
    --radius-lg: 16px;
    --radius-md: 12px;
  }

  * { box-sizing: border-box; }

  /* Custom Dark Scrollbars */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
  ::-webkit-scrollbar-thumb { background: #3A3F4D; border-radius: 4px; transition: background 0.2s ease; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent, #FFB000); }
  ::-webkit-scrollbar-corner { background: transparent; }
  textarea::-webkit-scrollbar { width: 5px; }
  textarea::-webkit-scrollbar-track { background: transparent; margin: 6px 2px; }
  textarea::-webkit-scrollbar-thumb { background: #3A3F4D; border-radius: 10px; }
  textarea::-webkit-scrollbar-thumb:hover { background: var(--accent, #FFB000); }
  * { scrollbar-width: thin; scrollbar-color: #3A3F4D rgba(0, 0, 0, 0.2); }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg-0);
    background-image: 
      radial-gradient(circle at 50% 20%, rgba(255, 176, 0, 0.06), transparent 50%);
    color: var(--text-0);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .farewell-card {
    max-width: 580px;
    width: 100%;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 40px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
  }

  .brand-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }

  .brand-mark { color: var(--accent); font-size: 22px; }
  .brand-name { font-size: 20px; font-weight: 800; }

  h1 { font-size: 26px; font-weight: 800; margin: 0 0 10px 0; }
  p.subtitle { font-size: 14.5px; color: var(--text-2); margin: 0 0 28px 0; line-height: 1.5; }

  .feedback-option {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .feedback-option:hover {
    border-color: var(--accent);
  }

  .feedback-option input[type="radio"] {
    accent-color: var(--accent);
    width: 18px;
    height: 18px;
    cursor: pointer;
  }

  .feedback-option span {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-0);
  }

  textarea {
    width: 100%;
    height: 100px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px;
    color: var(--text-0);
    font-family: inherit;
    font-size: 13.5px;
    resize: none;
    margin-top: 14px;
    margin-bottom: 24px;
    outline: none;
  }

  textarea:focus {
    border-color: var(--accent);
  }

  .submit-btn {
    background: var(--accent);
    color: #000;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 24px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    width: 100%;
    transition: background 0.2s ease;
  }

  .submit-btn:hover {
    background: var(--accent-hover);
  }

  .thank-you-msg {
    display: none;
    text-align: center;
    padding: 20px;
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.3);
    border-radius: var(--radius-md);
    color: #34D399;
    font-weight: 600;
    font-size: 15px;
  }
</style>
</head>
<body>

  <div class="farewell-card">
    <div class="brand-header">
      <span class="brand-mark">◆</span>
      <span class="brand-name">LootPrice</span>
    </div>

    <h1>We're sorry to see you go 👋</h1>
    <p class="subtitle">Thank you for trying LootPrice. If you have a moment, please let us know why you uninstalled so we can improve for future gamers.</p>

    <form id="feedback-form" onsubmit="submitFeedback(event)">
      <label class="feedback-option">
        <input type="radio" name="reason" value="not_useful" checked />
        <span>Didn't find deals or recommendations helpful</span>
      </label>

      <label class="feedback-option">
        <input type="radio" name="reason" value="missing_features" />
        <span>Missing a feature I needed</span>
      </label>

      <label class="feedback-option">
        <input type="radio" name="reason" value="too_complex" />
        <span>Too complex or hard to use</span>
      </label>

      <label class="feedback-option">
        <input type="radio" name="reason" value="testing" />
        <span>Just testing or temporary uninstall</span>
      </label>

      <textarea placeholder="Any additional comments or suggestions? (Optional)"></textarea>

      <button type="submit" class="submit-btn">Submit Feedback</button>
    </form>

    <div id="thank-you" class="thank-you-msg">
      Thank you for your feedback! We appreciate your help in making LootPrice better.
    </div>
  </div>

  <script>
    async function submitFeedback(e) {
      e.preventDefault();
      const reason = document.querySelector('input[name="reason"]:checked')?.value || 'Not specified';
      const comment = document.querySelector('textarea')?.value || '';

      // Secure FormSubmit endpoint hash (hides raw email address)
      const FORMSUBMIT_HASH = "c99e20fd2b9a3c80171b560bf7d31b91";
      const API_URL = `https://formsubmit.co/ajax/${FORMSUBMIT_HASH}`;

      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            _subject: 'New LootPrice Feedback Submission',
            Reason: reason,
            Comment: comment
          })
        });
      } catch (err) {
        console.log('Error submitting feedback:', err);
      }

      document.getElementById('feedback-form').style.display = 'none';
      document.getElementById('thank-you').style.display = 'block';
    }
  </script>

</body>
</html>
